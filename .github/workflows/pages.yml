name: Pages

# Deploys web/ (the static signup form + the confirm/unsubscribe/feedback
# landing page) to GitHub Pages via the official Actions-based flow —
# configure-pages / upload-pages-artifact / deploy-pages — adapted from
# GitHub's own starter workflow (fetched this session, 2026-09-05):
# https://raw.githubusercontent.com/actions/starter-workflows/main/pages/static.yml
# That starter pins older majors (checkout@v4, configure-pages@v5,
# upload-pages-artifact@v3, deploy-pages@v5); the versions below were instead
# checked against each action's GitHub Releases API this session and are the
# current major as of 2026-09-05:
#   actions/checkout              -> v7  (api.github.com/repos/actions/checkout/releases/latest -> v7.0.1; v7 tag exists)
#   actions/configure-pages       -> v6  (api.github.com/repos/actions/configure-pages/releases/latest -> v6.0.0; v6 tag exists)
#   actions/upload-pages-artifact -> v5  (api.github.com/repos/actions/upload-pages-artifact/releases/latest -> v5.0.0; v5 tag exists)
#   actions/deploy-pages          -> v5  (api.github.com/repos/actions/deploy-pages/releases/latest -> v5.0.1; v5 tag exists)
#
# ONE-TIME REPO SETUP THIS WORKFLOW CANNOT DO FOR YOU:
#   1. Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#      (deploy-pages fails otherwise). Note: tools/make-public.sh's printed
#      last command, `gh api -X POST .../pages -f 'source[branch]=main' -f
#      'source[path]=/'`, configures the OLD branch-deploy mode instead, and
#      even under that mode `path=/` would be wrong for this repo's layout
#      (index.html lives under web/, not at the repo root) — don't run that
#      line once this workflow exists; use the Actions source instead.
#   2. GitHub Pages is not available on a private repository on the free
#      plan — README.md's "Status" section and tools/make-public.sh already
#      flag this. This workflow will fail at the "Setup Pages" step until the
#      repo is public (or on a paid plan that supports private Pages).
"on":
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Matches the official starter workflow: only one deployment in flight, and a
# newer push wins rather than piling up queued runs, but an in-progress
# deploy is allowed to finish rather than being cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # web/ is the whole static site (index.html, action.html); nothing
      # outside it belongs on the public site, so it — not the repo root —
      # is what gets uploaded as the Pages artifact.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
