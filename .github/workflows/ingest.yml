name: Ingest

# Runs the daily PubMed ingest and commits the refreshed data/ archive back to
# the repo.
#
# Timing: 03:23 UTC, not 03:00. GitHub's own docs warn that the schedule event
# "can be delayed during periods of high loads of GitHub Actions workflow
# runs. High load times include the start of every hour. If the load is
# sufficiently high enough, some queued jobs may be dropped." Landing off the
# hour avoids the worst of that contention.
# Source: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows
#
# The commit-back step is deliberate, not incidental: GitHub also disables
# scheduled workflows automatically once a public repo goes quiet. Per the
# same page: "In a public repository, scheduled workflows are automatically
# disabled when no repository activity has occurred in 60 days." A daily data
# commit counts as that activity and keeps this workflow alive.

"on":
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to ingest'
        required: false
        type: string
        default: '7'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Job level, not step level: the commit step below also has to know whether
    # Supabase is the store, and a step-scoped env would read as empty there.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No package-lock.json exists yet (zero runtime dependencies today), so
      # `npm ci` would hard-fail with no lockfile to install from. `npm install`
      # works either way and keeps this step from breaking the day a real
      # dependency gets added.
      - name: Install dependencies
        run: npm install

      # src/cli-ingest.ts reads the window from `DAYS` (env) — not a CLI flag —
      # falling back to argv[2] and then 7. `days` only has a value on a
      # manual run; a scheduled run falls back to the workflow's own default
      # of 7. NCBI_API_KEY is optional — E-utilities works unauthenticated at
      # a lower rate limit, so an unset secret here (which GitHub resolves to
      # an empty string, not an error) must not break the job. `npm run
      # ingest` itself exits non-zero on zero papers or a fetch failure, and
      # nothing here swallows that.
      - name: Run ingest
        env:
          DAYS: ${{ inputs.days || '7' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: npm run ingest

      # Scoped to papers.json specifically, not `git add -f data/`: the ingest
      # step (src/state.ts upsertPapers) only ever touches papers.json. The
      # rest of data/ — users.json, seen.json, feedback.json, profiles.json —
      # holds subscriber emails and per-subscriber behavioral state, and this
      # is a public repo per the 60-day-inactivity rule cited above, so that
      # PII must never enter git history through this job. All of data/*.json
      # is gitignored for local dev, so `-f` is needed even for this one file.
      - name: Commit updated papers archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The paper cache only belongs in git when git IS the store. With Supabase
          # configured it is already durable, and committing it would push megabytes
          # of duplicated PubMed metadata on every run. The last-ingest stamp is
          # still committed either way: that commit is what resets GitHub's 60-day
          # inactivity clock on scheduled workflows.
          mkdir -p data
          date -u +%FT%TZ > data/last-ingest.txt
          git add -f data/last-ingest.txt
          if [ -z "${SUPABASE_URL:-}" ]; then
            git add -f data/papers.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update PubMed papers archive [skip ci]"
            git push
          fi
