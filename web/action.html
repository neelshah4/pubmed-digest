<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PubMed Digest</title>
<style>
  /* neel-theme v1.0: page tokens alias the kit's --nt-* tokens, so light and dark both follow */
  :root{
    --bg:var(--nt-paper); --surface:var(--nt-plate); --text:var(--nt-ink); --text-muted:var(--nt-ink-muted);
    --border:var(--nt-rule-strong); --accent:var(--nt-accent); --accent-strong:var(--nt-focus); --accent-contrast:var(--nt-on-accent);
    --danger:var(--nt-neg); --danger-bg:var(--nt-neg-wash); --success:var(--nt-pos); --success-bg:var(--nt-pos-wash);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--text);
       font-family:var(--nt-font-body);
       font-size:16px;line-height:1.55}
  main{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);
       border-radius:var(--nt-radius);padding:32px}
  h1{margin:0 0 8px;font-family:var(--nt-font-display);font-weight:500;font-size:28px;line-height:1.2;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--text-muted)}
  .paper{padding:12px 14px;background:var(--nt-sunken);border:1px solid var(--border);
         border-radius:var(--nt-radius-sm);margin:16px 0;font-size:16px;color:var(--text)}
  .status{padding:12px 14px;border-radius:var(--nt-radius-sm);margin:16px 0;font-family:var(--nt-font-display);font-weight:500}
  .status.ok{background:var(--success-bg);color:var(--success)}
  .status.err{background:var(--danger-bg);color:var(--danger)}
  .status.busy{background:var(--nt-sunken);color:var(--text-muted)}
  a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:var(--nt-radius-sm);background:var(--accent);
        color:var(--accent-contrast);text-decoration:none;font-family:var(--nt-font-display);font-weight:500;font-size:16px;
        transition:background-color 160ms var(--nt-ease)}
  a.btn:hover{background:var(--nt-accent-deep)}
  a.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
  .muted{font-size:16px;color:var(--nt-ink-quiet);margin-top:22px;border-top:1px solid var(--border);padding-top:14px}
  @media (max-width:480px){ main{padding:24px 20px} }
</style>
<!-- neel-theme:head:start -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/atkinson-hyperlegible-next@5.3.0/index.css" integrity="sha384-FCseDsHoKcEBM2m0ROvFzt/BHbmI1yGWHHBEiadKScJTLu/yPsDemuXEWAwmiLcM" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/literata@5.3.0/index.css" integrity="sha384-O4kpo19PDoVNx0Kht9/A717p+G1rP0FhuoU1ltVBruHCYKA525MOb2SkcvGBZhuy" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/atkinson-hyperlegible-mono@5.3.0/index.css" integrity="sha384-H5lC56FyzBmbZvNGbHeogfbg9KZXQ9Jdiojj+SPI7XUgpl6PfQ8CCXP8USguB+nt" crossorigin="anonymous" referrerpolicy="no-referrer">
<style id="neel-theme">
/* neel-theme v1.0 (2026-10-03) — universal light/dark kit for Neel's web tools.
   Light: L2 "formulary line" neutrals and type, with L3 green ink as the annotation layer.
   Dark:  D3 "bento plates" graphite neutrals, with the warm-editorial dark green (#8CCBAA).
   Three states (DESIGN.md 8.4): :root = light; OS dark applies only while the reader has not
   chosen (data-theme absent or "light" never set); [data-theme="dark"] forces dark.
   Every tool aliases its own token names to these --nt-* tokens, so both themes follow. */
:root{
  --nt-paper:#F4F6F5; --nt-plate:#FAFBFA; --nt-plate-focal:#FFFFFF; --nt-sunken:#EBEFEE;
  --nt-field:#FAFBFA; --nt-tint:#E5E9E9; --nt-tint-deep:#D6DBDB;
  --nt-ink:#1A1A1A; --nt-ink-muted:#3A3A3A; --nt-ink-quiet:#5F646A;
  --nt-rule:#D6DBDB; --nt-rule-strong:#BCC3C3; --nt-edge:#7A8187;
  --nt-accent:#1E5E45; --nt-accent-deep:#154533; --nt-accent-wash:#DDE8E1; --nt-on-accent:#F4F6F5;
  --nt-sel:#D3E4DA;
  --nt-pos:#1F6B4A; --nt-caution:#8A5E00; --nt-neg:#A33232;
  --nt-pos-wash:#D1DED1; --nt-caution-wash:#EDE0C7; --nt-neg-wash:#ECD0CA;
  --nt-cat-1:#3C5C98; --nt-cat-2:#9E4A2E; --nt-cat-3:#629857; --nt-cat-4:#8D4978; --nt-cat-5:#B18535;
  --nt-grid:#D6DBDB; --nt-focus:#154533;
  --nt-font-display:'Atkinson Hyperlegible Next Variable','Atkinson Hyperlegible Next',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --nt-font-body:'Literata Variable','Literata',Georgia,'Times New Roman',serif;
  --nt-font-mono:'Atkinson Hyperlegible Mono Variable','Atkinson Hyperlegible Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --nt-ease:cubic-bezier(0.23,1,0.32,1);
  --nt-radius:6px; --nt-radius-sm:4px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --nt-paper:#15191D; --nt-plate:#1E2429; --nt-plate-focal:#252D34; --nt-sunken:#101316;
    --nt-field:#252D34; --nt-tint:#2A323A; --nt-tint-deep:#343D46;
    --nt-ink:#E7ECEF; --nt-ink-muted:#C3CBD2; --nt-ink-quiet:#A3ADB6;
    --nt-rule:#2C343B; --nt-rule-strong:#3E474F; --nt-edge:#7F8A94;
    --nt-accent:#8CCBAA; --nt-accent-deep:#B2DEC6; --nt-accent-wash:#20302A; --nt-on-accent:#0F1417;
    --nt-sel:#233B33;
    --nt-pos:#6FD0A2; --nt-caution:#E0B24A; --nt-neg:#F28B8B;
    --nt-pos-wash:#1A2D22; --nt-caution-wash:#3D3016; --nt-neg-wash:#3C1C1A;
    --nt-cat-1:#7D9BD6; --nt-cat-2:#E08A63; --nt-cat-3:#8CC27F; --nt-cat-4:#C987B5; --nt-cat-5:#D9AE58;
    --nt-grid:#2C343B; --nt-focus:#B2DEC6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --nt-paper:#15191D; --nt-plate:#1E2429; --nt-plate-focal:#252D34; --nt-sunken:#101316;
  --nt-field:#252D34; --nt-tint:#2A323A; --nt-tint-deep:#343D46;
  --nt-ink:#E7ECEF; --nt-ink-muted:#C3CBD2; --nt-ink-quiet:#A3ADB6;
  --nt-rule:#2C343B; --nt-rule-strong:#3E474F; --nt-edge:#7F8A94;
  --nt-accent:#8CCBAA; --nt-accent-deep:#B2DEC6; --nt-accent-wash:#20302A; --nt-on-accent:#0F1417;
  --nt-sel:#233B33;
  --nt-pos:#6FD0A2; --nt-caution:#E0B24A; --nt-neg:#F28B8B;
  --nt-pos-wash:#1A2D22; --nt-caution-wash:#3D3016; --nt-neg-wash:#3C1C1A;
  --nt-cat-1:#7D9BD6; --nt-cat-2:#E08A63; --nt-cat-3:#8CC27F; --nt-cat-4:#C987B5; --nt-cat-5:#D9AE58;
  --nt-grid:#2C343B; --nt-focus:#B2DEC6;
  color-scheme:dark;
}
html{background:var(--nt-paper)}
body{transition:background-color 200ms var(--nt-ease), color 200ms var(--nt-ease)}
@media (prefers-reduced-motion: reduce){ body{transition:none} }

/* the Light | Dark tab control (injected by neel-theme.js) */
.nt-switch{position:fixed; top:12px; right:12px; z-index:2147483000; display:inline-flex; gap:2px; padding:3px;
  background:var(--nt-plate); border:1px solid var(--nt-edge); border-radius:8px;
  font:500 13px/1 var(--nt-font-display)}
.nt-switch button{all:unset; box-sizing:border-box; cursor:pointer; min-height:36px; min-width:56px; padding:0 12px;
  display:inline-flex; align-items:center; justify-content:center; border-radius:6px;
  color:var(--nt-ink-muted); font:inherit; letter-spacing:.01em}
.nt-switch button:hover{color:var(--nt-ink); background:var(--nt-tint)}
.nt-switch button[aria-pressed="true"]{background:var(--nt-accent); color:var(--nt-on-accent)}
.nt-switch button:focus-visible{outline:2px solid var(--nt-focus); outline-offset:2px}
@media (pointer:coarse){ .nt-switch button{min-height:44px} }
@media print{ .nt-switch{display:none} }
</style>
<script>/* neel-theme no-flash: apply a saved choice before first paint; migrate a legacy per-tool key once. */
(function(){try{var r=document.documentElement,k='neel.theme',t=localStorage.getItem(k);
if(!t){var o=r.getAttribute('data-nt-legacy');if(o){var v=localStorage.getItem(o);if(v==='light'||v==='dark'){t=v;localStorage.setItem(k,v);}}}
if(t==='light'||t==='dark')r.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- neel-theme:head:end -->
</head>
<body>
<main>
  <h1 id="title">Working…</h1>
  <p id="lede"></p>
  <div id="paper" class="paper" hidden></div>
  <div id="status" class="status busy" role="status" aria-live="polite">Contacting the server…</div>
  <p><a class="btn" href="./index.html">Manage your subscription</a></p>
  <p class="muted">
    Courtesy of the U.S. National Library of Medicine. Not affiliated with or endorsed by NLM or NIH.
  </p>
</main>
<script src="./config.js" onerror="window.__CONFIG_MISSING__=true"></script>
<script>
// Set by the Pages deploy (web/config.js, written by .github/workflows/pages.yml). Until then the page explains itself rather than failing silently.
const SUPABASE_URL  = window.__SUPABASE_URL__  || '';
const SUPABASE_ANON  = window.__SUPABASE_ANON__ || '';

const q = new URLSearchParams(location.search);
const action = (q.get('a') || '').toLowerCase();   // feedback | unsubscribe | confirm
const pmid = q.get('pmid') || '';
const tag = (q.get('tag') || '').toLowerCase();     // star | tilde | skip
const user = q.get('u') || '';
const token = q.get('t') || '';

const $ = (id) => document.getElementById(id);
const say = (cls, msg) => { const s = $('status'); s.className = 'status ' + cls; s.textContent = msg; };

const TAGS = {
  star:  { title: 'Marked as useful',  lede: 'More like this will rank higher in next week’s digest.' },
  tilde: { title: 'Noted as borderline', lede: 'This nudges the ranking gently, not decisively.' },
  skip:  { title: 'Noted, less like this', lede: 'Similar papers will be pushed down in future digests.' },
};

function invalid(msg) {
  $('title').textContent = 'That link looks wrong';
  $('lede').textContent = '';
  say('err', msg);
}

async function post(path, body) {
  if (!SUPABASE_URL || !SUPABASE_ANON) {
    say('err', 'This deployment has no backend configured yet, so your click was not recorded. '
      + 'Set SUPABASE_URL and SUPABASE_ANON in the Pages deploy.');
    return false;
  }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'authorization': `Bearer ${SUPABASE_ANON}`,
                 'content-type': 'application/json', 'prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(body),
    });
    if (!r.ok) { say('err', `The server rejected that (HTTP ${r.status}). Nothing was changed.`); return false; }
    return true;
  } catch {
    // Distinguish a network/CORS failure from a real server response.
    say('err', 'Could not reach the server. Check your connection and try the link again.');
    return false;
  }
}

(async function main() {
  if (action === 'feedback') {
    if (!/^\d{1,9}$/.test(pmid) || !TAGS[tag] || !user || !token)
      return invalid('That feedback link is missing or malformed.');
    $('title').textContent = TAGS[tag].title;
    $('lede').textContent = TAGS[tag].lede;
    $('paper').hidden = false;
    $('paper').textContent = `PMID ${pmid}`;
    // Goes through record_feedback(), which authorises on the token: a reader
    // clicking from an email has no session, so a plain table insert would be
    // refused by row-level security.
    if (await post('rpc/record_feedback', { p_user: user, p_token: token, p_pmid: pmid, p_tag: tag }))
      say('ok', 'Saved. That genuinely changes what you get.');

  } else if (action === 'unsubscribe') {
    if (!user || !token) return invalid('That unsubscribe link is missing its token.');
    $('title').textContent = 'Unsubscribing…';
    if (await post('rpc/unsubscribe', { p_user: user, p_token: token })) {
      $('title').textContent = 'You are unsubscribed';
      $('lede').textContent = 'No further digests will be sent to this address.';
      say('ok', 'Done. You can resubscribe any time.');
    }

  } else if (action === 'confirm') {
    if (!user || !token) return invalid('That confirmation link is missing its token.');
    $('title').textContent = 'Confirming…';
    if (await post('rpc/confirm_subscription', { p_user: user, p_token: token })) {
      $('title').textContent = 'Subscription confirmed';
      $('lede').textContent = 'Your first digest arrives on the next scheduled run.';
      say('ok', 'Confirmed. Nothing else to do.');
    }

  } else {
    invalid('This link needs an action. Open it from a digest email.');
  }
})();
</script>
<!-- neel-theme:body:start -->
<script>
/* neel-theme v1.0 — shared Light | Dark control. One key ("neel.theme") for every tool on the
   github.io origin; reads the tool's legacy key once (data-nt-legacy on <html>). data-theme stays
   unset until the reader chooses, so OS changes apply until then. Public API:
   window.NeelTheme.get() -> 'light'|'dark' (effective), .set('light'|'dark'), and a
   'neeltheme' event on document ({detail:{theme}}) for tools that repaint charts. */
(function(){
  var KEY = 'neel.theme', root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function stored(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
  function effective(){
    var t = root.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return mq && mq.matches ? 'dark' : 'light';
  }
  var btns = [];
  function sync(){
    var t = effective();
    btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-nt') === t)); });
    try { document.dispatchEvent(new CustomEvent('neeltheme', { detail: { theme: t } })); } catch(e){}
  }
  function set(t){
    if (t !== 'light' && t !== 'dark') return;
    root.setAttribute('data-theme', t);
    try { localStorage.setItem(KEY, t); } catch(e){ /* private mode: session-only */ }
    sync();
  }
  window.NeelTheme = { get: effective, set: set };
  function mount(){
    if (document.querySelector('.nt-switch')) return;
    var wrap = document.createElement('div');
    wrap.className = 'nt-switch'; wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Colour theme');
    ['light', 'dark'].forEach(function(t){
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-nt', t); b.textContent = t === 'light' ? 'Light' : 'Dark';
      b.addEventListener('click', function(){ set(t); });
      wrap.appendChild(b); btns.push(b);
    });
    document.body.appendChild(wrap);
    sync();
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', function(){ if (!stored()) sync(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
<!-- neel-theme:body:end -->
</body>
</html>
